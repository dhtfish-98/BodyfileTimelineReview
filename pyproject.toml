[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyfiletimelinereview"
version = "1.0.1"
description = "Bounded offline evidence review: BodyfileTimelineReview"
requires-python = ">=3.10"
license = "CPL-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
dependencies = []

[project.scripts]
bodyfiletimelinereview = "bodyfiletimelinereview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
