[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyfiletimelinereview"
version = "1.0.3"
authors = [{ name = "dhtfish98" }]
description = "Bounded offline evidence review: BodyfileTimelineReview"
requires-python = ">=3.10"
license = "CPL-1.0"
license-files = ["项目文档/LICENSE", "项目文档/THIRD_PARTY_NOTICES.txt", "项目文档/NEW_IMPLEMENTATION_NOTICE.txt"]
dependencies = []

[project.scripts]
bodyfiletimelinereview = "bodyfiletimelinereview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
